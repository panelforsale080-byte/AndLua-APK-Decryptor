plugins {
    id "com.android.application"
}

android {
    namespace "com.andlua.decryptor"
    compileSdk 34

    defaultConfig {
        applicationId "com.andlua.decryptor"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/INDEX.LIST"]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "io.github.reandroid:ARSCLib:1.3.5"
    implementation "com.android.tools.build:apksig:8.5.2"
}

tasks.register("copyRuntimeDex") {
    dependsOn ":runtime-stub:exportRuntimeDex"
    doLast {
        def dex = file("${rootDir}/app/src/main/assets/alpprotect-runtime.dex")
        if (!dex.exists() || dex.length() == 0) {
            throw new GradleException("alpprotect-runtime.dex missing after runtime-stub exportRuntimeDex")
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn "copyRuntimeDex"
}
